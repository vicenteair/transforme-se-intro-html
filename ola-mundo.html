<!--DOCTYPE - Serve para indicar que o documento é um documento HTML5 -->
<!DOCTYPE html>
<!-- HTML - Serve para definir o elemento raiz do documento HTML5. É o elemento principal que contém todo o conteúdo da página -->
<html lang="pt-br">
<!-- head - Serve para definir o cabeçalho do documento HTML5. É o elemento que contém informações sobre o documento, como o título e os metadados -->
<head>
    <!-- meta - Serve para definir metadados do documento HTML5. É o elemento que contém informações sobre o documento, como o conjunto de caracteres e a viewport -->
    <meta charset="UTF-8">
    <!-- viewport - Serve para definir a viewport do documento HTML5. É o elemento que contém informações sobre a largura e a escala inicial da viewport -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- title - Serve para definir o título do documento HTML5. É o elemento que contém o texto exibido na aba do navegador -->
    <title>Olá, Mundo!</title>
</head>
<body>
    Olá, mundo! Este é o meu primeiro programa em HTML5.
</body>
</html>
